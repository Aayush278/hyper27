<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Premium Plan</title>
    <!-- Fonts: Private Digital Estate Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Libre+Caslon+Text:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand: #f2ca50;
            --brand-light: #ffe088;
            --brand-dark: #b8972e;
            --cyan: #d4af37;
            --bg: #131313;
            --surface-100: #1c1b1b;
            --surface-400: #d0c5af;
            --white: #e5e2e1;
            --radius-md: 6px;
            --radius-xl: 12px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Hanken Grotesk', sans-serif;
            background-color: var(--bg);
            color: var(--white);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            font-family: 'Libre Caslon Text', serif;
            font-weight: 400;
            margin: 0 0 16px;
            font-size: 32px;
            letter-spacing: -0.01em;
        }

        .text-grad {
            background: linear-gradient(135deg, var(--white), var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 0 24px;
        }

        /* Using the featured card style from index.html */
        .card.featured {
            background: rgba(27, 59, 255, 0.04);
            border: 2px solid var(--cyan);
            border-radius: var(--radius-xl);
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.15);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card.featured:hover {
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.25);
            transform: translateY(-4px);
        }

        /* Label tag */
        .label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 99px;
            font-size: 12px;
            color: var(--brand);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 24px;
        }

        .label-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--brand);
            box-shadow: 0 0 10px var(--brand);
        }

        p {
            color: var(--surface-400);
            margin-bottom: 32px;
            font-size: 16px;
        }

        .amount {
            color: var(--brand);
            font-weight: 600;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 24px;
            background: var(--brand);
            color: var(--bg);
            text-decoration: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            box-shadow: 0 10px 30px rgba(242, 202, 80, 0.2);
            box-sizing: border-box;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(242, 202, 80, 0.4);
            border-color: var(--white);
        }

        .btn-primary svg {
            margin-right: 12px;
            width: 20px;
            height: 20px;
        }

        .icon-wrapper {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: var(--brand);
        }

        .icon-wrapper svg {
            width: 32px;
            height: 32px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card featured">
            <div class="label">
                <span class="label-dot"></span> Premium Member
            </div>
            
            <div class="icon-wrapper">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h1 class="text-grad">Payment Successful</h1>
            <p>Thank you! Your payment of <span class="amount">₹499</span> for the Premium plan has been received. Click below to access your exclusive WhatsApp group.</p>
            
            <a href="https://chat.whatsapp.com/LAY4hj4qbTw9bGiglq4237" class="btn-primary" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
                </svg>
                Join WhatsApp Group
            </a>
        </div>
    </div>
</body>
</html>
